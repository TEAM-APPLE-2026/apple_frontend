name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # @team-apple/hande-ai는 비공개 레포라 읽기 전용 토큰이 필요하다.
      # 레포 Settings > Secrets and variables > Actions에 HANDE_AI_TOKEN(hande-ai Contents: Read-only)을 등록할 것.
      - name: Configure access to private hande-ai
        env:
          HANDE_AI_TOKEN: ${{ secrets.HANDE_AI_TOKEN }}
        run: |
          if [ -z "$HANDE_AI_TOKEN" ]; then
            echo "::error::HANDE_AI_TOKEN secret이 없어 hande-ai를 설치할 수 없습니다."
            exit 1
          fi
          git config --global url."https://x-access-token:${HANDE_AI_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://x-access-token:${HANDE_AI_TOKEN}@github.com/".insteadOf "git@github.com:"

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
